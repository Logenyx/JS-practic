<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер</title>
    <link rel="stylesheet" href="clicker.css">
</head>
<body>
    <!-- ===== Экран игры ===== -->
    <div id="gameScreen" class="screen active">
        <!-- Иконка магазина -->
        <button id="shopIcon" title="Магазин">🛒</button>

        <div id="score">0</div>
        <div id="power">+1 за клик</div>
        <button id="clickBtn">Жми сюда</button>
        <div id="message"></div>
        <button id="resetBtn">Сброс</button>
    </div>

    <!-- ===== Экран магазина ===== -->
    <div id="shopScreen" class="screen">
        <div id="shopHeader">
            <button id="backBtn">← Назад</button>
            <h2>Магазин</h2>
            <div id="balance">0</div>
        </div>

        <!-- Сюда JS добавит карточки товаров -->
        <div id="cards"></div>

        <!-- Плашка с описанием выбранного товара -->
        <div id="itemInfo">
            <h3 id="infoName"></h3>
            <p id="infoDesc"></p>
            <button id="confirmBtn">Подтвердить</button>
            <div id="shopError"></div>
        </div>
    </div>

    <script src="js-test.js"></script>
</body>
</html>
