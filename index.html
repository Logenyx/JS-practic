<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер</title>
    <link rel="stylesheet" href="clicker.css">
</head>
<body>
    <!-- Тексты с атрибутом data-i18n JS подставляет из словаря на выбранном языке -->

    <!-- ===== Экран игры ===== -->
    <div id="gameScreen" class="screen active">
        <!-- Переключатель языка -->
        <div id="langSwitch">
            <button data-lang="ru">RU</button>
            <button data-lang="en">EN</button>
            <button data-lang="de">DE</button>
        </div>

        <!-- Иконка магазина -->
        <button id="shopIcon">🛒</button>

        <div id="score">0</div>
        <div id="power"></div>
        <button id="clickBtn" data-i18n="click"></button>
        <div id="message"></div>
        <button id="resetBtn" data-i18n="reset"></button>
    </div>

    <!-- ===== Экран магазина ===== -->
    <div id="shopScreen" class="screen">
        <div id="shopHeader">
            <button id="backBtn" data-i18n="back"></button>
            <h2 data-i18n="shop"></h2>
            <div id="balance">0</div>
        </div>

        <!-- Сюда JS добавит карточки товаров -->
        <div id="cards"></div>

        <!-- Плашка с описанием выбранного товара -->
        <div id="itemInfo">
            <h3 id="infoName"></h3>
            <p id="infoDesc"></p>
            <button id="confirmBtn" data-i18n="confirm"></button>
            <div id="shopError"></div>
        </div>
    </div>

    <script src="js-test.js"></script>
</body>
</html>
